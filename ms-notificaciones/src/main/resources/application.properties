

# 1. Identificacion del Microservicio
spring.application.name=ms-notificaciones
server.port=8092

# 2. Configuracion de Oracle con Wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@proyectotcg_high?TNS_ADMIN=C:/w_proyecto
spring.datasource.username=user_ms_notificaciones
spring.datasource.password=Duocuc12345.

# 3. JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Registro en Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# 5. Configuracion de Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.enable-hateoas=false

# 6. Redireccion de Eureka a Swagger (API Gateway)
eureka.instance.status-page-url=http://localhost:9000/swagger-ui.html
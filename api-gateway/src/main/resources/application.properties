
server.port=9000
spring.application.name=ms-gateway

# Configuración de Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true




spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://ms-auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**


spring.cloud.gateway.routes[1].id=pagos-service
spring.cloud.gateway.routes[1].uri=lb://ms-pagos
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/pagos/**


spring.cloud.gateway.routes[2].id=precios-service
spring.cloud.gateway.routes[2].uri=lb://ms-precios
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/precios/**


spring.cloud.gateway.routes[3].id=pedidos-service
spring.cloud.gateway.routes[3].uri=lb://ms-pedidos
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pedidos/**


spring.cloud.gateway.routes[4].id=inventario-service
spring.cloud.gateway.routes[4].uri=lb://ms-inventario
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/inventario/**